<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Performance · BreathBand® directions</title>
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<link rel="stylesheet" href="../../shared/frame.css">
<style>
/* ===================== Tokens: 02 Night Performance ===================== */
:root {
  /* colour */
  --ground: #0C0E11;
  --surface: #161A1F;
  --surface-2: #1F242B;
  --surface-3: #2A3038;
  --line: #262C34;
  --ink: #F1F3F5;
  --ink-2: #9AA4AE;
  --ink-disabled: #5B636C;
  --mint: #4ED69B;          /* in range / good */
  --amber: #E8A23A;         /* low score (never the inhale red) */
  --inhale: #F2554B;
  --exhale: #2F96F0;
  --inhale-tint: rgba(242, 85, 75, .16);
  --exhale-tint: rgba(47, 150, 240, .14);
  --mint-tint: rgba(78, 214, 155, .14);
  --btn: #F1F3F5;
  --btn-ink: #0C0E11;
  --scrim: rgba(5, 6, 8, .62);

  /* type */
  --font-display: 'Unbounded', system-ui, sans-serif;
  --font-ui: 'Archivo', system-ui, sans-serif;
  --fs-hero: 96px;
  --fs-timer: 52px;
  --fs-num: 22px;
  --fs-title: 20px;
  --fs-body: 15px;
  --fs-label: 13px;
  --fs-micro: 12px;
  --wide: 112%;             /* Archivo expanded, for UI headings */
  --semi: 92%;              /* Archivo semi-condensed, for meta */

  /* shape + space */
  --r-card: 16px;
  --r-sheet: 28px;
  --r-pill: 999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --gutter: 16px;

  /* depth: tone steps only; glow is reserved for live data marks */
  --shadow-float: 0 18px 40px -12px rgba(0, 0, 0, .7);
  --glow-data: 2.4;         /* feGaussianBlur stdDeviation on live traces */

  /* motion */
  --dur-fast: 160ms;
  --dur-base: 300ms;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-breath: cubic-bezier(.37, 0, .63, 1);   /* sine in-out: the pacer */

  /* icons */
  --icon-stroke: 1.9;

  /* frame */
  --frame-ground: var(--ground);
  --status-ink: var(--ink);
  --page-ground: #050607;
  --page-ink-2: #8C949C;
}

::selection { background: var(--mint); color: var(--btn-ink); }

/* ===================== Direction page ===================== */
.dir-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px 48px;
  align-items: end;
  margin-bottom: 40px;
  color: var(--ink);
  font-family: var(--font-ui);
}
.dir-head h1 {
  margin: 0;
  font: 800 44px/1 var(--font-display);
  letter-spacing: -0.02em;
}
.dir-head p { margin: 12px 0 0; font-size: 18px; color: var(--ink-2); }
.dir-meta { display: flex; gap: 32px; font-size: 14px; color: var(--ink-2); }
.dir-meta b { display: block; color: var(--ink); font-weight: 600; font-size: 15px; margin-top: 4px; }
.swatches { grid-column: 1 / -1; display: flex; gap: 8px; margin: 0; padding: 0; list-style: none; }
.swatches li { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; background: var(--surface); border-radius: var(--r-pill); font-size: 13px; color: var(--ink-2); }
.swatches i { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.swatches b { color: var(--ink); font-weight: 600; }
.bb-shot > figcaption { color: var(--page-ink-2); font-family: var(--font-ui); }

/* ===================== Screen base ===================== */
.scr {
  position: absolute;
  inset: 0;
  color: var(--ink);
  font: 400 var(--fs-body)/1.4 var(--font-ui);
  font-variant-numeric: tabular-nums;
  background: var(--ground);
}
.num { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.good { color: var(--mint); }
.low { color: var(--amber); }
.in-c { color: var(--inhale); }
.out-c { color: var(--exhale); }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.gap8 { gap: 8px; }
h2, h3, h4, p { margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; padding: 0 22px; border-radius: var(--r-pill);
  font: 600 16px/1 var(--font-ui); font-stretch: var(--wide); white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease-out);
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--btn); color: var(--btn-ink); }
.btn-quiet { background: var(--surface-2); color: var(--ink); }
.btn-go { background: var(--mint); color: var(--btn-ink); }
.btn[disabled] { background: var(--surface-2); color: var(--ink-disabled); }
.link {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
  color: var(--ink); font: 500 var(--fs-label)/1 var(--font-ui);
  text-decoration: underline; text-decoration-color: var(--surface-3); text-underline-offset: 4px;
}
.card { background: var(--surface); border-radius: var(--r-card); }

/* tab bar */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 84px;
  padding: 6px 12px 34px; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--ground); box-shadow: 0 -1px 0 var(--line);
  z-index: 20;
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 44px; color: var(--ink-2); font: 500 var(--fs-micro)/1 var(--font-ui); }
.tab.is-on { color: var(--ink); }
.tab.is-on::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--mint); margin-top: 1px; }

/* wave styling (shared classes from BB.waveSVG) */
.bb-w-mid { stroke: var(--surface-3); stroke-width: 1; }
.bb-w-pacer { stroke: rgba(241, 243, 245, .6); stroke-dasharray: 2 4; stroke-linecap: round; }
.bb-w-in { stroke: var(--inhale); stroke-linecap: round; }
.bb-w-out { stroke: var(--exhale); stroke-linecap: round; }
.bb-w-label { font: 600 var(--fs-micro) var(--font-ui); font-stretch: var(--wide); fill: var(--ink-2); }
.bb-w-tick { font: 500 var(--fs-micro) var(--font-ui); fill: var(--ink-2); }

/* ===================== 1 · Home ===================== */
.home .top { position: absolute; top: 58px; left: var(--gutter); right: var(--gutter); }
.greet { font: 700 var(--fs-title)/1.15 var(--font-ui); font-stretch: var(--wide); letter-spacing: -0.01em; }
.top .sub { color: var(--ink-2); font-size: var(--fs-label); margin-top: 3px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); font: 700 14px/44px var(--font-display); color: var(--ink); text-align: center; }
.status-row { display: flex; gap: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 8px; border-radius: var(--r-pill); background: var(--surface); font-size: var(--fs-micro); color: var(--ink-2); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 600; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }

.hero { position: absolute; top: 166px; left: var(--gutter); right: var(--gutter); }
.hero .meta { font-size: var(--fs-label); color: var(--ink-2); font-stretch: var(--semi); }
.hero-row { display: flex; align-items: flex-end; gap: 16px; margin-top: 2px; }
.big { font: 800 var(--fs-hero)/.92 var(--font-display); letter-spacing: -0.045em; }
.hero-side { padding-bottom: 6px; display: flex; flex-direction: column; gap: 4px; }
.hero-side .word { font: 700 22px/1 var(--font-display); letter-spacing: -0.02em; }
.hero-side .delta { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-label); color: var(--ink-2); white-space: nowrap; }
.hero-side .link { min-height: 36px; margin-bottom: -10px; }

.strip {
  position: absolute; top: 300px; left: var(--gutter); right: var(--gutter);
  display: grid; grid-template-columns: 1.15fr 1.15fr .8fr; background: var(--surface); border-radius: var(--r-card);
}
.cell { padding: 12px 12px 12px 14px; }
.cell + .cell { box-shadow: -1px 0 0 var(--line); }
.cell h4 { font: 600 var(--fs-micro)/1 var(--font-ui); color: var(--ink-2); display: flex; justify-content: space-between; }
.cell h4 span { font-weight: 600; }
.io { display: flex; gap: 14px; margin-top: 10px; }
.io div { display: flex; flex-direction: column; gap: 4px; }
.io small { font: 600 12px/1 var(--font-ui); font-stretch: var(--wide); letter-spacing: .02em; display: inline-flex; align-items: center; gap: 4px; }
.io .num { font-size: var(--fs-num); line-height: 1; }
.cell .num.solo { display: block; margin-top: 10px; font-size: var(--fs-num); line-height: 1; }
.cell .unit { display: block; font-size: 12px; color: var(--ink-2); margin-top: 6px; }

.quick { position: absolute; top: 396px; left: var(--gutter); right: var(--gutter); display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; }

.trend { position: absolute; top: 460px; left: var(--gutter); right: var(--gutter); padding: 14px 14px 12px; }
.trend h3, .recent h3 { font: 700 var(--fs-body)/1.2 var(--font-ui); font-stretch: var(--wide); }
.trend .split { display: grid; grid-template-columns: 1fr 112px; gap: 14px; margin-top: 8px; }
.trend .open { box-shadow: -1px 0 0 var(--line); padding-left: 14px; display: flex; flex-direction: column; }
.trend .open p { font-size: var(--fs-micro); color: var(--ink-2); line-height: 1.3; }
.trend .open .num { font-size: 20px; margin-top: 2px; }
.trend svg text { font: 500 var(--fs-micro) var(--font-ui); fill: var(--ink-2); }

.recent { position: absolute; top: 640px; left: var(--gutter); right: var(--gutter); }
.recent .row.head { height: 32px; }
.recent .link { min-height: 32px; }
.sess { display: flex; justify-content: space-between; align-items: center; min-height: 56px; box-shadow: 0 1px 0 var(--line); }
.sess .t { font-weight: 600; }
.sess .d { font-size: var(--fs-label); color: var(--ink-2); margin-top: 2px; }
.sess .r { text-align: right; }
.sess .r .num { font-size: 18px; }
.sess .r .w { display: block; font-size: var(--fs-micro); margin-top: 2px; }

/* ===================== 2 · Locked first run ===================== */
.locked .dim { position: absolute; inset: 0; filter: grayscale(1); opacity: .5; pointer-events: none; }
.locked .scrim { position: absolute; inset: 0; background: rgba(5, 6, 8, .5); }
.lockbadge {
  position: absolute; top: 146px; left: var(--gutter);
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 12px;
  background: var(--surface-2); border-radius: var(--r-pill); font: 600 var(--fs-label)/1 var(--font-ui); color: var(--ink);
  white-space: nowrap;
}
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: 236px;
  background: var(--surface); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow: var(--shadow-float); padding: 10px var(--gutter) 0;
}
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 0 auto 14px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps li { list-style: none; font: 600 var(--fs-micro)/1 var(--font-ui); color: var(--ink-2); }
.steps li::before { content: ''; display: block; height: 4px; border-radius: 2px; background: var(--surface-3); margin-bottom: 8px; }
.steps li.is-now { color: var(--ink); }
.steps li.is-now::before { background: var(--mint); }
.steps { padding: 0; margin: 0; }
.sheet h3 { font: 700 21px/1.15 var(--font-display); letter-spacing: -0.02em; margin-top: 20px; }
.gauge { margin-top: 12px; background: var(--ground); border-radius: var(--r-card); padding: 12px 12px 10px; }
.gauge svg text { font: 600 var(--fs-micro) var(--font-ui); fill: var(--ink-2); }
.gauge .state { display: flex; align-items: center; gap: 8px; margin-top: 6px; font: 700 var(--fs-body)/1.2 var(--font-ui); font-stretch: var(--wide); color: var(--mint); }
.gauge .state span { color: var(--ink-2); font-weight: 500; font-stretch: 100%; font-size: var(--fs-label); }
.instr { list-style: none; margin: 12px 0 0; padding: 0; }
.instr li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; padding: 7px 0; font-size: var(--fs-body); line-height: 1.3; }
.instr li .ic { color: var(--mint); margin-top: -1px; }
.instr li.is-now .ic { color: var(--ink); }
.instr li.done { color: var(--ink-2); }
.next {
  display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: center;
  margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-card);
}
.next p { font-size: var(--fs-label); color: var(--ink-2); line-height: 1.3; }
.next p b { display: block; color: var(--ink); font-size: var(--fs-label); font-weight: 600; margin-bottom: 2px; }
.sheet .btn-go { width: 100%; margin-top: 14px; height: 56px; }

/* ===================== 3 · Live paced session ===================== */
.live .topbar { position: absolute; top: 58px; left: var(--gutter); right: var(--gutter); display: flex; justify-content: space-between; align-items: center; }
.live .topbar .t { font: 700 var(--fs-body)/1.2 var(--font-ui); font-stretch: var(--wide); }
.live .topbar .d { font-size: var(--fs-micro); color: var(--ink-2); margin-top: 2px; }
.sound { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 12px; border-radius: var(--r-pill); background: var(--mint-tint); color: var(--mint); font: 600 var(--fs-label)/1 var(--font-ui); }
.timer { position: absolute; top: 112px; left: var(--gutter); right: var(--gutter); display: flex; justify-content: space-between; align-items: flex-end; }
.timer small { display: block; font: 600 var(--fs-micro)/1 var(--font-ui); color: var(--ink-2); margin-bottom: 6px; }
.timer .el { font: 800 var(--fs-timer)/.9 var(--font-display); letter-spacing: -0.04em; }
.timer .rem { text-align: right; }
.timer .rem .num { font-size: 24px; color: var(--ink-2); }
.prog { position: absolute; top: 178px; left: var(--gutter); right: var(--gutter); height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.pacer { position: absolute; top: 192px; left: 0; width: 390px; height: 300px; }
.pacer text { font-family: var(--font-ui); }
.cue { position: absolute; top: 494px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
.cue h3 { font: 800 30px/1 var(--font-display); letter-spacing: -0.03em; color: var(--inhale); display: inline-flex; align-items: center; gap: 10px; }
.cue p { font-size: var(--fs-label); color: var(--ink-2); margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; }
.cue p.good { color: var(--mint); font-weight: 600; }
.phase { position: absolute; top: 562px; left: var(--gutter); right: var(--gutter); height: 36px; display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--r-pill); overflow: hidden; font: 700 var(--fs-micro)/36px var(--font-ui); font-stretch: var(--wide); }
.phase span { padding: 0 14px; }
.phase .pin { background: var(--inhale-tint); color: var(--inhale); }
.phase .pout { background: var(--exhale-tint); color: var(--exhale); text-align: right; }
.phase .cursor { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); }
.strip-live { position: absolute; top: 610px; left: var(--gutter); right: var(--gutter); height: 100px; }
.ctrls { position: absolute; top: 722px; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: 0 40px; }
.ctrl { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 600 var(--fs-micro)/1 var(--font-ui); color: var(--ink-2); }
.ctrl .b { width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; }
.ctrl.main .b { width: 72px; height: 72px; background: var(--btn); color: var(--btn-ink); }
.ctrl.main { margin-top: -8px; color: var(--ink); }

/* ===================== 4 · Review ===================== */
.review .nav { position: absolute; top: 54px; left: 8px; right: var(--gutter); height: 44px; display: flex; align-items: center; justify-content: space-between; }
.review .nav .back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding-right: 8px; font: 600 var(--fs-body)/1 var(--font-ui); }
.review .nav .when { font-size: var(--fs-label); color: var(--ink-2); }
.rbody { position: absolute; top: 98px; left: var(--gutter); right: var(--gutter); display: flex; flex-direction: column; gap: 6px; }
.rhero { display: flex; align-items: flex-end; gap: 16px; }
.rhero .big { font-size: 74px; }
.rhero .side { padding-bottom: 6px; }
.rhero .side .word { font: 700 22px/1 var(--font-display); letter-spacing: -0.02em; }
.rhero .side p { font-size: var(--fs-label); color: var(--ink-2); margin-top: 4px; line-height: 1.3; }
.scores { padding: 2px 14px 4px; margin-top: 4px; }
.scores table { width: 100%; border-collapse: collapse; }
.scores th { font: 600 var(--fs-micro)/1 var(--font-ui); color: var(--ink-2); text-align: right; padding: 8px 0 6px; }
.scores th:first-child { text-align: left; }
.scores th span { display: inline-flex; align-items: center; gap: 5px; font-stretch: var(--wide); color: var(--ink); }
.scores td { padding: 5px 0; text-align: right; box-shadow: 0 -1px 0 var(--line); }
.scores td:first-child { text-align: left; font-weight: 600; }
.scores td .num { font-size: 20px; line-height: 1; margin-right: 4px; }
.scores td .w { font-size: var(--fs-micro); display: inline-block; width: 52px; text-align: left; }
.scores tr.sec td { color: var(--ink-2); }
.scores tr.sec td:first-child { font-weight: 500; }
.scores tr.sec .num { font-size: 16px; color: var(--ink-2); }
.scores tr.sec td small { display: block; font-size: 12px; font-weight: 400; }
.how { padding: 8px 14px 10px; background: var(--surface-2); }
.how .row { justify-content: space-between; }
.how h4 { font: 600 var(--fs-label)/1.2 var(--font-ui); display: inline-flex; gap: 6px; align-items: center; }
.how p { font-size: var(--fs-micro); color: var(--ink-2); margin-top: 6px; line-height: 1.35; }
.how svg text { font: 600 12px var(--font-ui); fill: var(--ink); }
.how svg text.k { fill: var(--ink-2); font-weight: 500; }
.wavecard { padding: 10px 0 8px; }
.chips { display: flex; gap: 6px; padding: 0 10px; }
.zchip { height: 32px; min-width: 44px; padding: 0 10px; border-radius: var(--r-pill); font: 600 var(--fs-micro)/32px var(--font-ui); color: var(--ink-2); background: var(--surface-2); position: relative; }
.zchip::after { content: ''; position: absolute; inset: -6px 0; } /* 44px hit area */
.zchip.is-on { background: var(--ink); color: var(--btn-ink); }
.wavecard .key { display: flex; gap: 12px; padding: 4px 12px 0; font-size: var(--fs-micro); color: var(--ink-2); align-items: center; flex-wrap: wrap; }
.wavecard .key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.wavecard .key i.p { border-top: 2px dotted rgba(241, 243, 245, .6); }
.wavecard .key i.d { width: 6px; height: 6px; border: 0; border-radius: 50%; background: var(--mint); }
.mini { display: flex; align-items: center; gap: 8px; padding: 6px 12px 0; font-size: var(--fs-micro); color: var(--ink-2); }
.mini .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); position: relative; }
.mini .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--ink); }
.note { padding: 0 2px; }
.note h4 { font: 600 var(--fs-micro)/1 var(--font-ui); color: var(--ink-2); }
.note p { font-size: var(--fs-body); line-height: 1.35; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.actions {
  position: absolute; left: 0; right: 0; bottom: 0; height: 104px;
  padding: 10px var(--gutter) 34px; background: var(--ground); box-shadow: 0 -1px 0 var(--line);
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; z-index: 5;
}
.actions .btn { height: 56px; padding: 0 12px; font-size: 15px; }
.actions .btn-quiet .good { display: inline-flex; }

/* ===================== iPad-free; reduced motion ===================== */
@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<main class="bb-page">
  <header class="dir-head" id="dirHead"></header>
  <div class="bb-row">
    <figure class="bb-shot" data-screen="home"><div class="bb-phone" id="ph-home"></div><figcaption>Home dashboard</figcaption></figure>
    <figure class="bb-shot" data-screen="locked"><div class="bb-phone" id="ph-locked"></div><figcaption>First run: locked dashboard + strap tension</figcaption></figure>
    <figure class="bb-shot" data-screen="live"><div class="bb-phone" id="ph-live"></div><figcaption>Live paced session (5-5), mid-inhale</figcaption></figure>
    <figure class="bb-shot" data-screen="review"><div class="bb-phone" id="ph-review"></div><figcaption>Session review (paced)</figcaption></figure>
  </div>
</main>

<script src="../../shared/mock-data.js"></script>
<script src="../../shared/directions.js"></script>
<script src="../../shared/bb.js"></script>
<script>
(function () {
  'use strict';
  var D = BB_DATA, B = BB, P = D.latestPaced, O = D.latestOpen;
  var DIR = BB_DIRECTIONS.filter(function (d) { return d.id === '02-night-performance'; })[0];
  var word = D.helpers.scoreWord, fmt = D.helpers.formatScore;
  var r1 = function (n) { return Math.round(n * 10) / 10; };

  function tone(score) {
    var b = word(score).band;
    return b === 'high' || b === 'good' ? 'good' : b === 'low' ? 'low' : '';
  }
  // glow filter, used on live / recorded data marks only
  var gid = 0;
  function glowDef(std) {
    gid += 1;
    var id = 'glow' + gid;
    return { id: id, def: '<filter id="' + id + '" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">' +
      '<feGaussianBlur stdDeviation="' + (std || 2.4) + '" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' };
  }
  function glowWave(svg) {
    var g = glowDef(2.2);
    return svg.replace('<defs>', '<defs>' + g.def).replace(/class="bb-w-(in|out)"/g, 'class="bb-w-$1" filter="url(#' + g.id + ')"');
  }
  function upArrow() {
    return '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2.5M2.5 5.5 6 2l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  // non-colour inhale/exhale markers: a peak above a line (in), a trough below a line (out)
  function inMark() {
    return '<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 8.5h10" stroke="currentColor" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M1.5 7.5 6 1.5l4.5 6" fill="none" stroke="var(--inhale)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function outMark() {
    return '<svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><path d="M1 1.5h10" stroke="currentColor" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 2"/><path d="M1.5 2.5 6 8.5l4.5-6" fill="none" stroke="var(--exhale)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function phone(id, html) {
    document.getElementById(id).innerHTML = B.statusBar() + '<div class="bb-screen">' + html + '</div>' + B.homeIndicator();
  }
  function tabbar(on) {
    var tabs = [['today', 'Today'], ['breathe', 'Breathe'], ['history', 'History'], ['profile', 'Profile']];
    return '<nav class="tabbar" aria-label="Main">' + tabs.map(function (t) {
      return '<button class="tab' + (t[0] === on ? ' is-on' : '') + '"' + (t[0] === on ? ' aria-current="page"' : '') + '>' + B.icon(t[0], 24) + t[1] + '</button>';
    }).join('') + '</nav>';
  }

  // ------------------------------------------------------------ page header
  document.getElementById('dirHead').innerHTML =
    '<div><h1>' + DIR.name + '</h1><p>' + DIR.positioning + '</p></div>' +
    '<div class="dir-meta"><div>Best for<b>' + DIR.bestFor + '</b></div><div>Type<b>' + DIR.fonts.join(' + ') + '</b></div></div>' +
    '<ul class="swatches">' + DIR.swatches.map(function (s) {
      return '<li><i style="background:' + s.hex + '"></i><b>' + s.name + '</b> ' + s.hex + '</li>';
    }).join('') + '</ul>';

  // ------------------------------------------------------------ shared bits
  var pacedHist = D.sessions.filter(function (s) { return s.type === 'Paced'; });
  var openHist = D.sessions.filter(function (s) { return s.type === 'Open'; });
  var prev = pacedHist[pacedHist.length - 2];
  var delta = P.scores.total - prev.scores.total;
  var deltaTxt = (delta >= 0 ? '+' : '−') + fmt(Math.abs(delta)) + ' vs ' + B.fmtDate(prev.date, true).split(' ')[0];

  function trendSVG() {
    var W = 196, H = 86, padL = 18, padR = 10, padT = 10, padB = 18;
    var vals = pacedHist.map(function (s) { return s.scores.total; });
    var lo = 5, hi = 8;
    var xy = vals.map(function (v, i) {
      return [r1(padL + i / (vals.length - 1) * (W - padL - padR)), r1(padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB))];
    });
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Breath Score over the last ' + vals.length + ' Paced sessions, from ' + fmt(vals[0]) + ' to ' + fmt(vals[vals.length - 1]) + '">';
    [5, 6, 7, 8].forEach(function (g) {
      var y = r1(padT + (1 - (g - lo) / (hi - lo)) * (H - padT - padB));
      s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + g + '</text>';
    });
    s += '<path d="' + B.linePath(xy) + '" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    xy.forEach(function (p, i) {
      var last = i === xy.length - 1;
      s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (last ? 5 : 3) + '" fill="' + (last ? 'var(--mint)' : 'var(--ink)') + '" stroke="var(--surface)" stroke-width="2"/>';
    });
    s += '<text x="' + padL + '" y="' + (H - 2) + '">' + B.fmtDate(pacedHist[0].date) + '</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 2) + '" text-anchor="end">' + B.fmtDate(pacedHist[pacedHist.length - 1].date) + '</text>';
    return s + '</svg>';
  }
  function openBars() {
    var W = 98, H = 40, bw = 16, gap = (W - bw * openHist.length) / (openHist.length - 1);
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Open sessions, time in normal range: ' +
      openHist.map(function (o) { return o.open.inRange + '%'; }).join(', ') + '">';
    openHist.forEach(function (o, i) {
      var h = Math.max(4, o.open.inRange / 100 * H), x = r1(i * (bw + gap));
      var last = i === openHist.length - 1;
      s += '<rect x="' + x + '" y="' + r1(H - h) + '" width="' + bw + '" height="' + r1(h) + '" rx="4" fill="' + (last ? 'var(--ink)' : 'var(--surface-3)') + '"/>';
    });
    return s + '</svg>';
  }

  // ------------------------------------------------------------ 1 · home
  (function () {
    var recent = D.sessions.slice(-4).reverse();
    var rows = recent.map(function (s) {
      var title = s.type === 'Paced' ? 'Paced ' + s.pacer : 'Open session';
      var meta = B.fmtDate(s.date, true) + ' · ' + B.fmtClock(s.duration);
      var right = s.type === 'Paced'
        ? '<span class="num">' + fmt(s.scores.total) + '</span><span class="w ' + tone(s.scores.total) + '">' + word(s.scores.total).word + '</span>'
        : '<span class="num">' + s.open.inRange + '%</span><span class="w muted">in range · ' + s.open.rate + ' br/min</span>';
      return '<div class="sess"><div><div class="t">' + title + '</div><div class="d">' + meta + '</div></div><div class="r">' + right + '</div></div>';
    }).join('');

    var cell = function (label, a, b) {
      var both = word(Math.min(a, b)).word === word(Math.max(a, b)).word ? word(a).word : word(a).word + ' / ' + word(b).word;
      return '<div class="cell"><h4>' + label + '<span class="' + tone(Math.min(a, b)) + '">' + both + '</span></h4>' +
        '<div class="io"><div><small class="in-c">' + inMark() + 'IN</small><span class="num">' + a + '</span></div>' +
        '<div><small class="out-c">' + outMark() + 'OUT</small><span class="num">' + b + '</span></div></div></div>';
    };

    phone('ph-home', '<div class="scr home">' +
      '<header class="top"><div class="row between"><div><h2 class="greet">Good morning, ' + D.user.firstName + '</h2>' +
        '<p class="sub">' + D.today.label + '</p></div><button class="avatar" aria-label="Profile">' + D.user.initials + '</button></div>' +
        '<div class="status-row"><span class="chip"><span class="dot"></span>' + B.icon('bluetooth', 14) + '<b>Strap</b> ' + D.device.battery + '%</span>' +
        '<span class="chip">' + B.icon('cloudCheck', 16) + '<b>BreathCloud</b> synced ' + D.cloud.lastSync + '</span></div></header>' +

      '<section class="hero" aria-label="Last session"><p class="meta">Last session · ' + P.pacerLabel + ' · ' + B.fmtDate(P.date, true) + ' · ' + P.durationLabel + '</p>' +
        '<div class="hero-row"><span class="big">' + fmt(P.scores.total) + '</span><div class="hero-side">' +
        '<span class="word ' + tone(P.scores.total) + '">' + word(P.scores.total).word + '</span>' +
        '<span class="delta">' + upArrow() + deltaTxt + '</span>' +
        '<a class="link" href="#how">' + B.icon('help', 16) + 'How scores work</a></div></div></section>' +

      '<div class="strip">' + cell('Timing', P.scores.timing.inhale, P.scores.timing.exhale) + cell('Depth', P.scores.depth.inhale, P.scores.depth.exhale) +
        '<div class="cell"><h4>Length</h4><span class="num solo">' + P.durationLabel + '</span><span class="unit">min · timed</span></div></div>' +

      '<div class="quick"><button class="btn btn-primary">' + B.icon('play', 18) + 'Paced 5-5</button>' +
        '<button class="btn btn-quiet">Open session</button></div>' +

      '<section class="card trend"><div class="row between"><h3>Breath Score</h3><span class="muted" style="font-size:12px">Last ' + pacedHist.length + ' Paced</span></div>' +
        '<div class="split"><div>' + trendSVG() + '</div>' +
        '<div class="open"><p>Open sessions, time in normal range</p><span class="num">' + O.metrics.inRange.value + '%</span><div style="margin-top:auto">' + openBars() + '</div></div></div></section>' +

      '<section class="recent"><div class="row between head"><h3>Recent</h3><a class="link" href="#history">See all</a></div>' + rows + '</section>' +
      tabbar('today') + '</div>');
  })();

  // ------------------------------------------------------------ 2 · locked first run
  (function () {
    var T = D.calibration.tension;
    var W = 334, x0 = 10, x1 = W - 10, y = 46;
    var X = function (v) { return r1(x0 + v * (x1 - x0)); };
    var g = glowDef(3);
    var ticks = '';
    for (var i = 0; i <= 40; i++) {
      var v = i / 40, major = i % 5 === 0, inR = v >= T.rangeLow - 1e-9 && v <= T.rangeHigh + 1e-9;
      ticks += '<line x1="' + X(v) + '" x2="' + X(v) + '" y1="' + (y - (major ? 14 : 8)) + '" y2="' + y + '" stroke="' + (inR ? 'var(--mint)' : 'var(--surface-3)') + '" stroke-width="' + (major ? 2 : 1.4) + '" stroke-linecap="round"/>';
    }
    var gauge = '<svg width="' + W + '" height="84" viewBox="0 0 ' + W + ' 84" role="img" aria-label="Strap tension gauge: needle inside the green in-range zone">' +
      '<defs>' + g.def + '</defs>' +
      '<rect x="' + X(T.rangeLow) + '" y="' + (y + 6) + '" width="' + r1(X(T.rangeHigh) - X(T.rangeLow)) + '" height="10" rx="5" fill="var(--mint-tint)"/>' +
      '<rect x="' + x0 + '" y="' + (y + 9) + '" width="' + r1(x1 - x0) + '" height="4" rx="2" fill="var(--surface-2)"/>' +
      '<rect x="' + x0 + '" y="' + (y + 9) + '" width="' + r1(X(T.value) - x0) + '" height="4" rx="2" fill="var(--mint)" filter="url(#' + g.id + ')"/>' +
      ticks +
      '<path d="M' + X(T.value) + ' ' + (y - 24) + 'v44" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" filter="url(#' + g.id + ')"/>' +
      '<circle cx="' + X(T.value) + '" cy="' + (y + 11) + '" r="7" fill="var(--ink)" stroke="var(--ground)" stroke-width="3"/>' +
      '<text x="' + x0 + '" y="80">Loose</text>' +
      '<text x="' + r1((X(T.rangeLow) + X(T.rangeHigh)) / 2) + '" y="80" text-anchor="middle" style="fill:var(--mint)">In range</text>' +
      '<text x="' + x1 + '" y="80" text-anchor="end">Too tight</text></svg>';

    // next step preview: three maximal balloon breaths
    var nx = [], k;
    for (k = 0; k <= 60; k++) nx.push([r1(k / 60 * 74), r1(22 - 17 * Math.sin(k / 60 * Math.PI * 6))]);
    var nextSVG = '<svg width="74" height="44" viewBox="0 0 74 44" aria-hidden="true">' +
      '<line x1="0" x2="74" y1="22" y2="22" stroke="var(--surface-3)" stroke-dasharray="3 3"/>' +
      '<path d="' + B.smoothPath(nx) + '" fill="none" stroke="var(--ink-2)" stroke-width="1.8"/></svg>';

    var ghost = '<div class="scr" aria-hidden="true">' +
      '<header class="top" style="position:absolute;top:58px;left:16px;right:16px"><h2 class="greet">Welcome, ' + D.user.firstName + '</h2><p class="sub" style="color:var(--ink-2);font-size:13px;margin-top:3px">' + D.today.label + '</p></header>' +
      '<section class="hero" style="top:118px"><p class="meta">Breath Score</p></section>' +
      '<div class="strip" style="top:250px;height:84px"></div>' +
      '<div class="quick" style="top:346px"><button class="btn" disabled>Paced</button><button class="btn" disabled>Open session</button></div>' +
      '<section class="card trend" style="top:410px;height:150px"></section>' + tabbar('today') + '</div>';

    phone('ph-locked', '<div class="scr locked">' +
      '<div class="dim">' + ghost + '</div><div class="scrim"></div>' +
      '<div class="lockbadge">' + B.icon('lock', 16) + 'Locked until your strap is calibrated</div>' +
      '<section class="sheet" role="dialog" aria-label="Strap calibration"><div class="grabber"></div>' +
        '<ol class="steps" aria-label="Calibration steps"><li class="is-now" aria-current="step">Strap tension</li><li>Balloon breaths</li><li>Ready</li></ol>' +
        '<h3>Tighten until it’s green</h3>' +
        '<div class="gauge">' + gauge + '<div class="state">' + B.icon('check', 20) + 'In range <span>Hold it there</span></div></div>' +
        '<ol class="instr">' +
          '<li class="done"><span class="ic">' + B.icon('check', 20) + '</span>Wrap the strap between your belly button and the bottom of your rib cage.</li>' +
          '<li class="done"><span class="ic">' + B.icon('check', 20) + '</span>Pull your stomach in and tighten until the gauge turns green.</li>' +
          '<li class="is-now"><span class="ic">' + B.icon('lock', 20) + '</span>Lock the clip.</li></ol>' +
        '<div class="next">' + nextSVG + '<p><b>Next: balloon breaths</b>Imagine your belly is a balloon. Fill it and empty it as far as you can, three times.</p></div>' +
        '<button class="btn btn-go">Continue to pre-calibration' + B.icon('chevronRight', 18) + '</button>' +
      '</section></div>');
  })();

  // ------------------------------------------------------------ 3 · live paced session
  (function () {
    var L = B.liveState(), hz = P.sampleHz;
    var cx = 195, cy = 150, rMin = 58, rMax = 118;
    var rp = r1(rMin + L.pacerSize * (rMax - rMin)), ru = r1(rMin + L.userSize * (rMax - rMin));
    var diff = ru - rp, onPacer = Math.abs(diff) < 4;
    var status = onPacer ? 'Locked on to the pacer' : diff > 0 ? 'Slightly ahead of the pacer' : 'Slightly behind the pacer';
    var g = glowDef(5), g2 = glowDef(2);
    var bez = '';
    for (var i = 0; i < L.breathsTotal; i++) {
      var a = -Math.PI / 2 + i / L.breathsTotal * Math.PI * 2;
      var done = i < L.breathNumber - 1, now = i === L.breathNumber - 1;
      var r0 = 134, r2 = now ? 148 : 143;
      bez += '<line x1="' + r1(cx + Math.cos(a) * r0) + '" y1="' + r1(cy + Math.sin(a) * r0) + '" x2="' + r1(cx + Math.cos(a) * r2) + '" y2="' + r1(cy + Math.sin(a) * r2) +
        '" stroke="' + (now ? 'var(--inhale)' : done ? 'var(--ink)' : 'var(--surface-3)') + '" stroke-width="' + (now ? 4 : 3) + '" stroke-linecap="round"' + (now ? ' filter="url(#' + g2.id + ')"' : '') + '/>';
    }
    var ring = '<svg class="pacer" viewBox="0 0 390 300" role="img" aria-label="Circle pacer mid-inhale. Thin white ring is the pacer, glowing red ring is your breath, ' + status.toLowerCase() + '.">' +
      '<defs>' + g.def + g2.def + '</defs>' + bez +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + rMax + '" fill="none" stroke="var(--surface-2)" stroke-width="1.5" stroke-dasharray="2 5"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + rMin + '" fill="var(--surface)" stroke="var(--surface-2)" stroke-width="1.5"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + ru + '" fill="none" stroke="var(--inhale)" stroke-width="10" filter="url(#' + g.id + ')" opacity=".95"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + rp + '" fill="none" stroke="var(--ink)" stroke-width="2"/>' +
      '<text x="' + cx + '" y="' + (cy - 6) + '" text-anchor="middle" style="font:800 28px var(--font-display);fill:var(--ink);letter-spacing:-0.02em">' + L.breathNumber + '</text>' +
      '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" style="font:600 12px var(--font-ui);fill:var(--ink-2)">of ' + L.breathsTotal + ' breaths</text>' +
      '</svg>';

    // line pacer strip: last 20 s of you, pacer running 10 s ahead
    var SW = 358, SH = 100, pad = { l: 38, r: 4, t: 6, b: 6 };
    var box = { x: pad.l, y: pad.t, w: SW - pad.l - pad.r, h: SH - pad.t - pad.b };
    var t0 = L.t - 20, t1 = L.t + 10, midY = r1(box.y + box.h / 2);
    var pXY = B.toXY(B.slice(P.pacerWave, hz, t0, t1, 300), box, t0, t1, 4);
    var uXY = B.toXY(B.slice(P.userWave, hz, t0, L.t, 300), box, t0, t1, 4);
    var nowX = r1(box.x + (L.t - t0) / (t1 - t0) * box.w), nowY = r1(box.y + box.h / 2 - L.user / 4 * box.h / 2);
    var g3 = glowDef(2.2);
    var strip = '<svg width="' + SW + '" height="' + SH + '" viewBox="0 0 ' + SW + ' ' + SH + '" role="img" aria-label="Line pacer: the last 20 seconds of your breathing against the pacer, inhale above the line, exhale below">' +
      '<defs>' + g3.def + '<clipPath id="lsIn"><rect x="0" y="0" width="' + SW + '" height="' + midY + '"/></clipPath><clipPath id="lsOut"><rect x="0" y="' + midY + '" width="' + SW + '" height="' + SH + '"/></clipPath></defs>' +
      '<rect x="' + nowX + '" y="' + box.y + '" width="' + r1(box.x + box.w - nowX) + '" height="' + box.h + '" fill="var(--surface)" rx="6"/>' +
      '<line class="bb-w-mid" x1="' + box.x + '" x2="' + (box.x + box.w) + '" y1="' + midY + '" y2="' + midY + '" stroke-dasharray="4 4"/>' +
      '<path class="bb-w-pacer" d="' + B.smoothPath(pXY) + '" fill="none" stroke-width="1.6"/>' +
      '<path d="' + B.smoothPath(uXY) + '" fill="none" stroke="var(--inhale)" stroke-width="2.4" clip-path="url(#lsIn)" filter="url(#' + g3.id + ')"/>' +
      '<path d="' + B.smoothPath(uXY) + '" fill="none" stroke="var(--exhale)" stroke-width="2.4" clip-path="url(#lsOut)" filter="url(#' + g3.id + ')"/>' +
      '<line x1="' + nowX + '" x2="' + nowX + '" y1="' + box.y + '" y2="' + (box.y + box.h) + '" stroke="var(--ink-2)" stroke-width="1"/>' +
      '<circle cx="' + nowX + '" cy="' + nowY + '" r="5" fill="var(--inhale)" stroke="var(--ground)" stroke-width="2" filter="url(#' + g3.id + ')"/>' +
      '<text class="bb-w-label" x="' + (pad.l - 6) + '" y="' + (box.y + 12) + '" text-anchor="end">IN</text>' +
      '<text class="bb-w-label" x="' + (pad.l - 6) + '" y="' + (box.y + box.h - 3) + '" text-anchor="end">OUT</text>' +
      '<text class="bb-w-tick" x="' + (nowX + 8) + '" y="' + (box.y + box.h - 6) + '">Pacer ahead</text></svg>';

    phone('ph-live', '<div class="scr live">' +
      '<div class="topbar"><div><div class="t">' + P.pacerLabel + '</div><div class="d">' + D.user.skillLevel + ' · Timed ' + P.durationLabel + '</div></div>' +
        '<button class="sound" aria-pressed="true" aria-label="Musical note guidance on">' + B.icon('note', 18) + 'Notes on</button></div>' +
      '<div class="timer"><div><small>Elapsed</small><span class="el num">' + L.elapsed + '</span></div>' +
        '<div class="rem"><small>Left</small><span class="num">' + L.remaining + '</span></div></div>' +
      '<div class="prog" role="progressbar" aria-valuenow="' + Math.round(L.progress * 100) + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + r1(L.progress * 100) + '%"></i></div>' +
      ring +
      '<div class="cue"><h3>Breathe in</h3><p' + (onPacer ? ' class="good"' : '') + '>' + (onPacer ? B.icon('check', 14) + ' ' : '') + status + '</p></div>' +
      '<div class="phase" aria-hidden="true"><span class="pin">' + inMark() + ' In · 5 s</span><span class="pout">Out · 5 s ' + outMark() + '</span>' +
        '<i class="cursor" style="left:' + r1(L.phaseProgress * 0.5 * 100) + '%"></i></div>' +
      '<div class="strip-live">' + strip + '</div>' +
      '<div class="ctrls"><div class="ctrl"><button class="b" aria-label="End session">' + B.icon('stop', 22) + '</button>End</div>' +
        '<div class="ctrl main"><button class="b" aria-label="Pause">' + B.icon('pause', 28) + '</button>Pause</div>' +
        '<div class="ctrl"><button class="b" aria-label="Switch to line pacer">' + B.icon('history', 22) + '</button>Line view</div></div>' +
    '</div>');
  })();

  // ------------------------------------------------------------ 4 · review
  (function () {
    var S = P.scores, hz = P.sampleHz;
    var t0 = 150, t1 = 210, W = 358, H = 112;
    var pad = { l: 34, r: 18, t: 6, b: 32 };
    var svg = glowWave(B.waveSVG({
      samples: P.userWave, pacer: P.pacerWave, hz: hz, t0: t0, t1: t1, width: W, height: H, range: 4, pad: pad,
      ticks: true, stroke: 2.2, pacerStroke: 1.6,
      title: 'Your breathing against the pacer from 2:30 to 3:30. Inhale above the midline in red, exhale below in blue, pacer dotted.'
    }));
    // per-breath timing accuracy dots under each pacer peak
    var box = { x: pad.l, w: W - pad.l - pad.r };
    var peaks = B.breaths(P.userWave, hz);
    var dots = '';
    for (var tp = Math.ceil((t0 - 5) / 10) * 10 + 5; tp <= t1; tp += 10) {
      var best = null;
      peaks.forEach(function (b) { if (!best || Math.abs(b.peakT - tp) < Math.abs(best.peakT - tp)) best = b; });
      var dev = Math.abs(best.peakT - tp) / 5 * 100;
      var sc = Math.max(1, 10 - Math.floor(dev / 10));
      var x = r1(box.x + (tp - t0) / (t1 - t0) * box.w);
      dots += '<circle cx="' + x + '" cy="' + (H - 26) + '" r="3.5" fill="' + (sc >= 7 ? 'var(--mint)' : 'var(--amber)') + '"><title>Breath at ' + B.fmtClock(tp) + ': timing ' + sc + ' · ' + word(sc).word + '</title></circle>';
    }
    svg = svg.replace('</svg>', dots + '</svg>');

    var chips = D.timeAxis.map(function (c) {
      return '<button class="zchip' + (c === '60 s' ? ' is-on' : '') + '"' + (c === '60 s' ? ' aria-pressed="true"' : ' aria-pressed="false"') + '>' + c + '</button>';
    }).join('');

    var rowS = function (label, s, sec) {
      var cellS = function (v) { return '<td><span class="num">' + v + '</span><span class="w ' + (sec ? '' : tone(v)) + '">' + word(v).word + '</span></td>'; };
      return '<tr' + (sec ? ' class="sec"' : '') + '><td>' + label + (sec ? '<small>Secondary, not in total</small>' : '') + '</td>' + cellS(s.inhale) + cellS(s.exhale) + '</tr>';
    };

    // conversion scale: 10 cells, deviation band under the ends
    var conv = D.scoring.conversion, cw = 32.6, sc = '';
    conv.forEach(function (c, i) {
      var x = r1(i * cw);
      sc += '<rect x="' + x + '" y="0" width="' + r1(cw - 2) + '" height="22" rx="5" fill="' + (c.score >= 7 ? 'var(--mint-tint)' : c.score >= 5 ? 'var(--surface-3)' : 'rgba(232,162,58,.16)') + '"/>' +
        '<text x="' + r1(x + (cw - 2) / 2) + '" y="15" text-anchor="middle">' + c.score + '</text>';
    });
    var scale = '<svg width="326" height="22" viewBox="0 0 326 22" role="img" aria-label="Score scale: 0 to 10 percent off the pacer scores 10, each further 10 percent scores one less, 90 percent or more scores 1">' + sc + '</svg>';

    var dur = P.duration;
    phone('ph-review', '<div class="scr review">' +
      '<div class="nav"><button class="back">' + B.icon('chevronLeft', 24) + 'History</button><span class="when">' + B.fmtDate(P.date, true) + ' · ' + P.time + '</span></div>' +
      '<div class="rbody"><section class="rhero"><span class="big">' + fmt(S.total) + '</span><div class="side">' +
        '<span class="word ' + tone(S.total) + '">' + word(S.total).word + '</span>' +
        '<p>Total Breath Score · ' + deltaTxt + '<br>' + P.pacerLabel + ' · ' + P.durationLabel + ' · ' + P.skillLevel + '</p></div></section>' +
      '<section class="card scores"><table><thead><tr><th>Accuracy</th><th><span>' + inMark() + 'Inhale</span></th><th><span>' + outMark() + 'Exhale</span></th></tr></thead><tbody>' +
        rowS('Timing', S.timing) + rowS('Depth', S.depth) + rowS('Smoothness', S.smoothness, true) + '</tbody></table></section>' +
      '<section class="card how" id="how" aria-label="How scores work"><div class="row"><h4>' + B.icon('help', 16) + 'How scores work</h4><button class="link" aria-label="Close" style="min-height:24px">' + B.icon('close', 16) + '</button></div>' +
        '<div style="margin-top:6px">' + scale + '</div>' +
        '<p>Within 10% of the pacer scores 10. Each further 10% off costs a point; past 1 SD scores 1.</p></section>' +
      '<section class="card wavecard"><div class="chips" role="group" aria-label="Time axis">' + chips + '</div>' + svg +
        '<div class="mini"><span>' + B.fmtClock(t0) + '–' + B.fmtClock(t1) + '</span><span class="bar"><i style="left:' + r1(t0 / dur * 100) + '%;width:' + r1((t1 - t0) / dur * 100) + '%"></i></span><span>' + P.durationLabel + '</span></div>' +
        '<div class="key"><span><i class="p"></i>Pacer</span><span><i style="border-color:var(--inhale)"></i>In</span><span><i style="border-color:var(--exhale)"></i>Out</span><span><i class="d"></i>Breath on time</span></div></section>' +
      '<section class="note"><h4>Session note</h4><p>' + P.note + '</p></section></div>' +
      '<div class="actions"><button class="btn btn-primary">' + B.icon('pdf', 20) + 'Export PDF</button>' +
        '<button class="btn btn-quiet"><span class="good">' + B.icon('cloudCheck', 20) + '</span>BreathCloud</button></div>' +
    '</div>');
  })();

  B.initPage();
})();
</script>
</body>
</html>
